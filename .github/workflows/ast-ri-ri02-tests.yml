name: AST-RI RI-02 tests

on:
  pull_request:
    paths:
      - "ast-ri/ri02-claim-equation-extraction/**"
      - ".github/workflows/ast-ri-ri02-tests.yml"
  push:
    branches:
      - main
      - ast-ri-ri02-claim-equation-extraction
    paths:
      - "ast-ri/ri02-claim-equation-extraction/**"
      - ".github/workflows/ast-ri-ri02-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        working-directory: ast-ri/ri02-claim-equation-extraction
        run: python -m pip install -e .
      - name: Run unit tests
        working-directory: ast-ri/ri02-claim-equation-extraction
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
